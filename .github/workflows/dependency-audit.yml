name: Dependency Audit

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Export requirements
        run: uv export --no-dev --no-emit-project --format requirements-txt -o requirements.txt

      - name: Run audit
        run: uvx pip-audit -r requirements.txt
